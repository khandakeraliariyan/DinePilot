services:

  mongodb:
    image: mongo:7
    container_name: dinepilot-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-dinepilot}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-dinepilot}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: dinepilot-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-dinepilot}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-dinepilot}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: dinepilot-eureka-server
    restart: unless-stopped
    ports:
      - "${EUREKA_PORT:-8761}:8761"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: dinepilot-api-gateway
    restart: unless-stopped
    environment:
      EUREKA_HOST: eureka-server
    depends_on:
      - eureka-server
    ports:
      - "${GATEWAY_PORT:-8080}:8080"

volumes:
  mongo-data:
  rabbitmq-data:
