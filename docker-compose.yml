services:

  mongodb:
    image: mongo:7
    container_name: dinepilot-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: dinepilot-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-dinepilot}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-dinepilot}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: dinepilot-eureka-server
    restart: unless-stopped
    ports:
      - "${EUREKA_PORT:-8761}:8761"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: dinepilot-api-gateway
    restart: unless-stopped
    environment:
      EUREKA_HOST: eureka-server
    depends_on:
      - eureka-server
    ports:
      - "${GATEWAY_PORT:-8080}:8080"

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: dinepilot-user-service
    restart: unless-stopped
    environment:
      EUREKA_HOST: eureka-server
      MONGO_URI: ${MONGO_URI_USER_SERVICE}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - eureka-server
    ports:
      - "${USER_SERVICE_PORT:-8081}:8081"

  restaurant-service:
    build:
      context: .
      dockerfile: restaurant-service/Dockerfile
    container_name: dinepilot-restaurant-service
    restart: unless-stopped
    environment:
      EUREKA_HOST: eureka-server
      MONGO_URI: ${MONGO_URI_RESTAURANT_SERVICE}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - eureka-server
    ports:
      - "${RESTAURANT_SERVICE_PORT:-8082}:8082"

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: dinepilot-order-service
    restart: unless-stopped
    environment:
      EUREKA_HOST: eureka-server
      MONGO_URI: ${MONGO_URI_ORDER_SERVICE:-mongodb://mongodb:27017/order_db}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - eureka-server
      - mongodb
      - restaurant-service
    ports:
      - "${ORDER_SERVICE_PORT:-8084}:8084"

  reservation-service:
    build:
      context: .
      dockerfile: reservation-service/Dockerfile
    container_name: dinepilot-reservation-service
    restart: unless-stopped
    environment:
      EUREKA_HOST: eureka-server
      MONGO_URI: ${MONGO_URI_RESERVATION_SERVICE:-mongodb://mongodb:27017/reservation_db}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - eureka-server
      - mongodb
      - restaurant-service
    ports:
      - "${RESERVATION_SERVICE_PORT:-8083}:8083"

  billing-service:
    build:
      context: .
      dockerfile: billing-service/Dockerfile
    container_name: dinepilot-billing-service
    restart: unless-stopped
    environment:
      EUREKA_HOST: eureka-server
      MONGO_URI: ${MONGO_URI_BILLING_SERVICE:-mongodb://mongodb:27017/billing_db}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - eureka-server
      - mongodb
      - rabbitmq
      - order-service
    ports:
      - "${BILLING_SERVICE_PORT:-8085}:8085"

volumes:
  mongo-data:
  rabbitmq-data:
