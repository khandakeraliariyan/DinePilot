server:
  port: 8085

spring:
  application:
    name: billing-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/billing_db}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
