server:
  port: 8085

spring:
  application:
    name: billing-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/billing_db}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:dinepilot}
    password: ${RABBITMQ_DEFAULT_PASS:dinepilot}

jwt:
  secret: ${JWT_SECRET:HZ+XCLqA5NGg9IezhLOdOOqv2PUf1PB7fgMii0y/gR7stKUJ/24qBexjk5XC44Wd-dev-only}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
